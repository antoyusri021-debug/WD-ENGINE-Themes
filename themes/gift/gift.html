<!DOCTYPE html>
<html>
<head>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; background: transparent; }
        #gift-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .gift-card {
            display: none; /* Awalnya sembunyi */
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #fe2c55;
            border-radius: 100px;
            padding: 15px 35px;
            color: white;
            animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 30px rgba(254, 44, 85, 0.6);
            align-items: center;
        }
        .gift-icon { 
            width: 70px; 
            height: 70px; 
            margin-right: 20px; 
            filter: drop-shadow(0 0 10px #fff);
        }
        .text-info { display: flex; flex-direction: column; }
        .username { font-weight: bold; color: #25f4ee; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .gift-detail { font-size: 18px; color: #ffffff; }
        .count-badge {
            margin-left: 15px;
            background: #fe2c55;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 22px;
            font-style: italic;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.5) translateY(100px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>
    <div id="gift-container">
        <div id="card" class="gift-card">
            <img id="g-icon" class="gift-icon" src="">
            <div class="text-info">
                <span id="g-user" class="username">User</span>
                <span id="g-name" class="gift-detail">mengirim Mawar!</span>
            </div>
            <div id="g-count" class="count-badge">x1</div>
        </div>
    </div>

    <script>
        const socket = io();
        const card = document.getElementById('card');
        let timer;
        
        // Sesuaikan dengan event di server.js (new-gift-monitor)
        socket.on('new-gift-monitor', (data) => {
            // Kita coba ambil icon dari data. Jika di server.js belum ada, 
            // setidaknya teks muncul dulu.
            const giftImg = data.giftIcon || 'https://p16-va-default.akamaized.net/obj/v-us/7074251703138307077'; 

            document.getElementById('g-icon').src = giftImg;
            document.getElementById('g-user').innerText = data.nickname || data.user;
            document.getElementById('g-name').innerText = "Mengirim " + data.giftName;
            document.getElementById('g-count').innerText = "x" + (data.count || 1);
            
            card.style.display = 'flex';
            
            // Reset timer jika ada gift masuk berturut-turut
            clearTimeout(timer);
            timer = setTimeout(() => {
                card.style.display = 'none';
            }, 5000); // Tampil 5 detik
        });
    </script>
</body>
</html>
