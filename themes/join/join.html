<!DOCTYPE html>
<html>
<head>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: transparent; }
        
        #join-container { 
            position: fixed; 
            bottom: 50px; 
            left: 20px; 
        }

        .join-notif {
            background: rgba(30, 30, 30, 0.95); 
            color: #ffffff; 
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-left: 4px solid #444; /* Warna border gelap netral */
            
            /* Animasi masuk dan keluar */
            animation: slideIn 0.5s ease forwards, fadeOut 0.5s ease 3s forwards;
            white-space: nowrap;
        }

        .join-notif span {
            color: #ffffff;
            margin: 0 8px;
            opacity: 0.8;
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-10); }
        }
    </style>
</head>
<body>
    <div id="join-container"></div>

    <script>
        const socket = io();
        const container = document.getElementById('join-container');
        let queue = [];
        let isProcessing = false;

        socket.on('new-join', (data) => {
            queue.push(data); // Masukkan setiap join baru ke daftar tunggu
            processQueue();
        });

        function processQueue() {
            // Jika sedang ada notifikasi yang tampil atau daftar kosong, berhenti dulu
            if (isProcessing || queue.length === 0) return;

            isProcessing = true;
            const userData = queue.shift(); // Ambil data paling pertama di antrean

            const div = document.createElement('div');
            div.className = 'join-notif';
            div.innerHTML = `🌑 <span>Welcome</span> ${userData.user}`;
            
            container.appendChild(div);

            // Waktu tampil notifikasi (3.5 detik)
            setTimeout(() => {
                div.remove();
                isProcessing = false;
                processQueue(); // Lanjut proses antrean berikutnya jika ada
            }, 3500); 
        }
    </script>
</body>
</html>
