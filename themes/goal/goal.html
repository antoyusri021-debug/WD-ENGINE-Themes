<!DOCTYPE html>
<html>
<head>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: transparent; font-family: 'Segoe UI', sans-serif; color: white; margin: 0; padding: 10px; }
        .goal-container { 
            width: 380px; padding: 15px; background: rgba(0,0,0,0.85); 
            border-radius: 15px; border: 2px solid #fe2c55;
            box-shadow: 0 0 15px rgba(254, 44, 85, 0.4);
        }
        .label { font-weight: bold; text-align: center; margin-bottom: 10px; text-transform: uppercase; color: #fe2c55; }
        .progress-bg { width: 100%; height: 30px; background: #333; border-radius: 20px; overflow: hidden; position: relative; }
        .progress-bar { 
            height: 100%; background: linear-gradient(90deg, #fe2c55, #25f4ee); 
            width: 0%; transition: width 1s ease-out; 
        }
        .status { 
            position: absolute; width: 100%; text-align: center; top: 0; 
            font-weight: bold; font-size: 16px; line-height: 30px; text-shadow: 1px 1px 2px black; 
        }
    </style>
</head>
<body>
    <div class="goal-container">
        <div id="goal-label" class="label">MEMUAT TARGET...</div>
        <div class="progress-bg">
            <div id="bar" class="progress-bar"></div>
            <div id="text" class="status">0 / 0</div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentTarget = 100;

        // Ambil data awal saat overlay dibuka
        socket.on('init-goal', (data) => {
            document.getElementById('goal-label').innerText = data.label;
            currentTarget = data.target;
            updateUI(data.current);
        });

        // Update progres setiap ada gift masuk
        socket.on('update-goal', (data) => {
            updateUI(data.current);
        });

        function updateUI(current) {
            let percent = (current / currentTarget) * 100;
            if (percent > 100) percent = 100;
            
            document.getElementById('bar').style.width = percent + "%";
            document.getElementById('text').innerText = `${current} / ${currentTarget}`;
            
            if (current >= currentTarget) {
                document.getElementById('goal-label').innerText = "🔥 TARGET TERCAPAI! 🔥";
                document.getElementById('goal-label').style.color = "#25f4ee";
            }
        }
    </script>
</body>
</html>
