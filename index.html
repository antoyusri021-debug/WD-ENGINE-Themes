<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDTiktok Engine - Monitoring Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0b0d0f;
            --card-bg: #141619;
            --gold-gradient: linear-gradient(135deg, #f1c40f 0%, #d35400 100%);
            --premium-gradient: linear-gradient(135deg, #c3a561 0%, #ecf0f1 50%, #c3a561 100%);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .container { max-width: 720px; width: 100%; display: flex; flex-direction: column; align-items: center; }

        /* Gaya Card yang Kamu Suka */
        .main-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            width: 100%;
            text-align: center;
        }

        h1 { font-size: 3rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 30px; }
        h1 span { background: var(--gold-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        /* Overlay Container di Dalam Card */
        #chat-monitor {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            height: 350px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            border: 1px inset rgba(255,255,255,0.02);
        }

        .chat-bubble {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            border-radius: 15px;
            color: #ffffff;
            font-size: 0.9rem;
            text-align: left;
            border-left: 4px solid #f1c40f;
            animation: bubbleSlideIn 0.4s ease-out forwards;
        }

        @keyframes bubbleSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group { display: flex; gap: 10px; width: 100%; }
        input { flex: 1; background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 15px; color: white; border-radius: 12px; outline: none; }
        input:focus { border-color: #f1c40f; }

        .btn-send { background: var(--gold-gradient); border: none; padding: 0 25px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>WD<span>Tiktok</span> Monitor</h1>

        <div class="main-card">
            <div id="chat-monitor">
                <div class="text-gray-500 text-sm py-20">Menunggu data real-time...</div>
            </div>

            <div class="input-group">
                <input type="text" id="commentInput" placeholder="Ketik pesan baru...">
                <button class="btn-send" onclick="addComment()">KIRIM</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://sbbcxsowhcospqfhxhmp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNiYmN4c293aGNvc3BxZmh4aG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNTI4NzMsImV4cCI6MjA4NzcyODg3M30.8eHGLCwfxvb-9dMHHQvDJp6OcfWAzZHwcBI1TDpo7qw';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const monitor = document.getElementById('chat-monitor');

        function renderChat(pesan) {
            // Hapus teks placeholder jika ada
            if (monitor.querySelector('.text-gray-500')) monitor.innerHTML = '';

            const div = document.createElement('div');
            div.className = 'chat-bubble';
            div.innerHTML = `<strong>User:</strong> ${pesan}`;
            monitor.appendChild(div);
            monitor.scrollTop = monitor.scrollHeight;
        }

        async function addComment() {
            const input = document.getElementById('commentInput');
            if (input.value.trim() !== "") {
                await _supabase.from('komentar_wd').insert([{ pesan: input.value }]);
                input.value = "";
            }
        }

        // Realtime Listener
        _supabase.channel('any')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'komentar_wd' }, 
            payload => {
                renderChat(payload.new.pesan);
            })
            .subscribe();

        // Load Data Awal agar tidak kosong
        async function init() {
            const { data } = await _supabase.from('komentar_wd').select('pesan').limit(10).order('id', {ascending: false});
            if (data) {
                data.reverse().forEach(item => renderChat(item.pesan));
            }
        }
        init();
    </script>
</body>
</html>
