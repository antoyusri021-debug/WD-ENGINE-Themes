<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDev Overlay Sync | Monitoring Mode</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background-color: #0a0a0a; color: white; }
        .chat-entry { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .yellow-glow { box-shadow: 0 0 15px rgba(250, 204, 21, 0.15); }
    </style>
</head>
<body class="p-6">

    <div class="max-w-xl mx-auto">
        <div class="flex items-center gap-3 mb-8 border-b border-white/10 pb-4">
            <div class="w-10 h-10 bg-yellow-400 rounded flex items-center justify-center shadow-lg shadow-yellow-400/20">
                <span class="text-black font-black text-xl">W</span>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tighter text-yellow-400 uppercase">WebDev Overlay</h1>
                <p id="status-koneksi" class="text-[10px] text-gray-500 uppercase tracking-widest">Mencoba Menghubungkan...</p>
            </div>
        </div>

        <div id="chat-container" class="bg-[#111] p-4 rounded-xl border border-white/5 h-[450px] overflow-y-auto space-y-3 yellow-glow">
            <div class="text-center py-20 text-gray-600 animate-pulse">
                <i class="fas fa-spinner fa-spin mb-2"></i><br>
                Menghubungkan ke Supabase...
            </div>
        </div>

        <p class="mt-4 text-[10px] text-center text-gray-600 uppercase tracking-widest">
            Project: sbbcxsowhcospqfhxhmp // Table: komentar_wd
        </p>
    </div>

    <script>
        // 2. KONFIGURASI (Sesuai Data Kamu)
        const SUPABASE_URL = 'https://sbbcxsowhcospqfhxhmp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNiYmN4c293aGNvc3BxZmh4aG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNTI4NzMsImV4cCI6MjA4NzcyODg3M30.8eHGLCwfxvb-9dMHHQvDJp6OcfWAzZHwcBI1TDpo7qw';
        
        // Inisialisasi
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const container = document.getElementById('chat-container');
        const statusText = document.getElementById('status-koneksi');

        // Fungsi Menampilkan Chat
        function showChat(user, msg) {
            const div = document.createElement('div');
            div.className = 'chat-entry bg-white/[0.03] p-3 rounded-lg border-l-2 border-yellow-400';
            div.innerHTML = `
                <div class="text-yellow-400 font-bold text-[10px] uppercase tracking-tighter">${user}</div>
                <div class="text-gray-200 text-sm mt-1">${msg}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // 3. AMBIL DATA AWAL (Yang ada di foto kamu)
        async function loadData() {
            try {
                const { data, error } = await supabase
                    .from('komentar_wd')
                    .select('*')
                    .order('id', { ascending: false })
                    .limit(10);

                if (error) throw error;

                if (data) {
                    container.innerHTML = ''; // Hapus loader
                    statusText.innerText = "🟢 Online - Terhubung ke Supabase";
                    statusText.classList.replace('text-gray-500', 'text-green-500');
                    
                    data.reverse().forEach(item => {
                        showChat(`User #${item.id}`, item.pesan);
                    });
                }
            } catch (err) {
                console.error("Gagal load data:", err.message);
                statusText.innerText = "🔴 Offline - Gagal Koneksi";
                container.innerHTML = `<div class="text-red-500 text-xs p-4">Error: ${err.message}</div>`;
            }
        }

        // 4. REALTIME (Listen chat baru tanpa refresh)
        function enableRealtime() {
            supabase
                .channel('room1')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'komentar_wd' 
                }, (payload) => {
                    console.log('Pesan baru masuk!', payload);
                    showChat(`User #${payload.new.id}`, payload.new.pesan);
                })
                .subscribe();
        }

        // Jalankan saat halaman dibuka
        window.onload = () => {
            loadData();
            enableRealtime();
        };
    </script>
</body>
</html>
